; Copie este arquivo para  config\configuracao.ini  e ajuste a pasta abaixo.
; Escreva o caminho normal do Windows, sem aspas e sem trocar as barras.
; ATENÇÃO: instale o robô FORA do "Meu Drive" (ex.: C:\Robos\decweb). Dentro do Meu Drive o
; clientes.csv (com senhas) e os logs seriam sincronizados com a nuvem.
[pastas]
; pasta "001_FECHAMENTO FISCAL" (com 001_ e underscore, confirmada no Drive) que contém 07_JULHO, 08_AGOSTO, 09_SETEMBRO...
; Se a letra do seu Drive não for I:, troque só a letra.
; Dentro de cada mês o robô usa "002 ARQUIVOS MUNICIPAIS" (e "003 ARQUIVOS PORTAL NACIONAL" na conferência).
raiz_fechamento = I:\Meu Drive\1015_ROTINA AUTOMATICA\001 FECHAMENTO FISCAL\001_FECHAMENTO FISCAL

[opcoes]
; conferencia = sim  -> antes de enviar, compara o Prestados do DecWeb com a planilha Emitidas do Portal Nacional.
; Desligada por enquanto (Portal Nacional fora do ar). Também dá para ligar numa execução só com --com-conferencia.
conferencia = nao
; Só vale com conferencia ligada, quando NÃO existe planilha Emitidas do cliente:
;   enviar   -> segue e envia assim mesmo (registra aviso)
;   bloquear -> não envia (registra pendência)
sem_emitidas = enviar
