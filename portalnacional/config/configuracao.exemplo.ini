; Copie este arquivo para  config\configuracao.ini  e ajuste a pasta abaixo.
; É o MESMO formato do robô DecWeb: pode copiar o configuracao.ini de lá (as outras chaves são ignoradas).
; Escreva o caminho normal do Windows, sem aspas e sem trocar as barras.
[pastas]
; pasta "001_FECHAMENTO FISCAL" (com 001_ e underscore) que contém 07_JULHO, 08_AGOSTO, 09_SETEMBRO...
; Dentro de cada mês o robô salva em "003 ARQUIVOS PORTAL NACIONAL". Se a letra do seu Drive não for I:, troque só a letra.
raiz_fechamento = I:\Meu Drive\1015_ROTINA AUTOMATICA\001 FECHAMENTO FISCAL\001_FECHAMENTO FISCAL
